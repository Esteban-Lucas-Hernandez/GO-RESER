# ==============================
# CONFIG BDD H2 (IN-MEMORY / DEMO)
# ==============================
spring.datasource.url=jdbc:h2:mem:go_reser_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# ==============================================================================
# CONFIG BDD POSTGRESQL (OPCIONAL / PRODUCCIÓN / LOCAL)
# Para usar PostgreSQL en lugar de H2 en memoria:
# 1. Comenta el bloque de H2 arriba y la inicialización de data.sql
# 2. Descomenta las siguientes líneas con los datos de tu base de datos:
# ==============================================================================
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:go_reser_db}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:tu_contraseña}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false

# Consola Web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Inicialización de Datos SQL Completa (Departamentos, Ciudades, Chat, Hoteles, Habitaciones y Usuarios de Supabase)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ==============================
# OPTIMIZACIÓN RENDIMIENTO Y MEMORIA
# ==============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
server.tomcat.max-connections=100

# ==============================
# CONFIG SERVIDOR
# ==============================
server.port=${PORT:8080}

# ==============================
# CONFIG JWT
# ==============================
jwt.expiration=3600000

# ==============================
# CONFIG CORREO - GMAIL
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# CONFIG OAUTH2 - GOOGLE
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub